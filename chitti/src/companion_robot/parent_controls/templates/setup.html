{% extends "base.html" %}
{% block body %}
<h1>Set up Chitti's parent PIN</h1>
<p>This PIN protects parent controls on this device. It is only used
here, on your home network.</p>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>PIN: <input type="password" name="pin"></label><br>
  <label>Confirm PIN: <input type="password" name="confirm"></label><br>
  <button type="submit">Set PIN</button>
</form>
{% endblock %}
