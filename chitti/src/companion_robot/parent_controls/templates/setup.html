{% extends "base.html" %}
{% block body %}
<h1>Set up Chitti's parent PIN</h1>
<p class="hint">This PIN protects parent controls on this device. It is only used
here, on your home network.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>PIN <input type="password" name="pin"></label>
  <label>Confirm PIN <input type="password" name="confirm"></label>
  <button type="submit">Set PIN</button>
</form>
{% endblock %}
