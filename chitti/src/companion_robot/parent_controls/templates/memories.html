{% extends "base.html" %}
{% block body %}
<h1>Memories</h1>
<ul>
{% for r in records %}
  <li>
    [{{ r.category.value }}] {{ r.content }}
    <form method="post" action="{{ url_for('delete_memory', profile_id=profile_id, memory_id=r.id) }}" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Delete</button>
    </form>
  </li>
{% endfor %}
</ul>
<p><a href="{{ url_for('profiles_view') }}">Back</a></p>
{% endblock %}
